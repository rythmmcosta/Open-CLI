<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b14"/>
      <stop offset="100%" style="stop-color:#0d1421"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00cc7e"/>
      <stop offset="50%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#9b5fe8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#00cc7e" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
  </g>

  <!-- Orbs -->
  <ellipse cx="100" cy="150" rx="220" ry="220" fill="#00cc7e" opacity="0.08" filter="url(#glow)"/>
  <ellipse cx="1100" cy="480" rx="180" ry="180" fill="#9b5fe8" opacity="0.08" filter="url(#glow)"/>

  <!-- Terminal mockup -->
  <rect x="660" y="160" width="480" height="300" rx="10" fill="#0d1421" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="660" y="160" width="480" height="40" rx="10" fill="rgba(0,0,0,0.3)"/>
  <rect x="660" y="190" width="480" height="10" fill="rgba(0,0,0,0.3)"/>
  <circle cx="685" cy="180" r="6" fill="#ff5f57"/>
  <circle cx="705" cy="180" r="6" fill="#febc2e"/>
  <circle cx="725" cy="180" r="6" fill="#28c840"/>
  <!-- Terminal text lines -->
  <text x="680" y="228" font-family="'JetBrains Mono', monospace" font-size="13" fill="#00cc7e">❯ opencli "analyze project"</text>
  <text x="680" y="256" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00b4d8">⠋ Scanning 47 files...</text>
  <text x="680" y="284" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b95a1">  TypeScript 5.x, Node.js</text>
  <text x="680" y="312" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00cc7e">✓ Analysis complete 2.3s</text>
  <text x="680" y="348" font-family="'JetBrains Mono', monospace" font-size="13" fill="#00cc7e">❯ opencli --skill python "add API"</text>
  <text x="680" y="376" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00cc7e">✓ Written to src/routes/users.py</text>
  <text x="680" y="412" font-family="'JetBrains Mono', monospace" font-size="13" fill="#00cc7e">❯ <rect x="830" y="400" width="7" height="13" fill="#00cc7e" opacity="0.8"/></text>
  <rect x="836" y="400" width="7" height="13" fill="#00cc7e" opacity="0.8"/>

  <!-- Logo / headline -->
  <polygon points="80,148 60,200 75,200 68,240 96,186 80,186 95,148" fill="url(#accent)" filter="url(#glow)"/>
  <text x="110" y="210" font-family="'JetBrains Mono', monospace" font-size="64" font-weight="700" fill="white" letter-spacing="2">OPEN CLI</text>

  <!-- Tagline -->
  <text x="80" y="268" font-family="Inter, sans-serif" font-size="26" fill="#64748b">AI Terminal for Developers</text>

  <!-- Badges row -->
  <rect x="80" y="310" width="120" height="32" rx="16" fill="rgba(0,204,126,0.1)" stroke="rgba(0,204,126,0.25)" stroke-width="1"/>
  <text x="140" y="331" font-family="'JetBrains Mono', monospace" font-size="13" fill="#00cc7e" text-anchor="middle">45 Skills</text>
  <rect x="212" y="310" width="140" height="32" rx="16" fill="rgba(0,180,216,0.1)" stroke="rgba(0,180,216,0.25)" stroke-width="1"/>
  <text x="282" y="331" font-family="'JetBrains Mono', monospace" font-size="13" fill="#00b4d8" text-anchor="middle">26 MCP Servers</text>
  <rect x="364" y="310" width="145" height="32" rx="16" fill="rgba(155,95,232,0.1)" stroke="rgba(155,95,232,0.25)" stroke-width="1"/>
  <text x="436" y="331" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9b5fe8" text-anchor="middle">17 AI Providers</text>
  <rect x="496" y="310" width="120" height="32" rx="16" fill="rgba(0,204,126,0.1)" stroke="rgba(0,204,126,0.25)" stroke-width="1"/>
  <text x="556" y="331" font-family="'JetBrains Mono', monospace" font-size="13" fill="#00cc7e" text-anchor="middle">Open Source</text>

  <!-- npm install pill -->
  <rect x="80" y="380" width="330" height="44" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="100" y="408" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5568">$ </text>
  <text x="124" y="408" font-family="'JetBrains Mono', monospace" font-size="16" fill="#00cc7e">npm install -g open-cli</text>

  <!-- Bottom bar -->
  <rect x="0" y="598" width="1200" height="2" fill="url(#accent)" opacity="0.5"/>
  <text x="80" y="622" font-family="Inter, sans-serif" font-size="14" fill="#334155">opencli.myowncloud.tech</text>
  <text x="1120" y="622" font-family="'JetBrains Mono', monospace" font-size="14" fill="#334155" text-anchor="end">v1.0.0</text>
</svg>
